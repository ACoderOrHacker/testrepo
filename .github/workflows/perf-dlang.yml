name: D Performance

on:
  workflow_dispatch:
  push:
    branches: [master, dev]
    paths-ignore:
      - "src/**"
      - "include/**"
      - "tests/**.cpp"
      - "benchmarks/**.cpp"
      - "cmake/**"
      - "CMakeLists.txt"
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "SECURITY.md"
      - "zensical.toml"
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  benchmark:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 little-endian
            runner: ubuntu-latest
            compiler: ldc-latest
            arch: x86_64
          - name: Linux x86 32-bit little-endian
            runner: ubuntu-latest
            compiler: ldc-latest
            arch: x86
          - name: Linux arm64 little-endian
            runner: ubuntu-24.04-arm
            compiler: ldc-latest
            arch: aarch64
          - name: Windows x86_64 little-endian
            runner: windows-latest
            compiler: ldc-latest
            arch: x86_64
          - name: macOS arm64 little-endian
            runner: macos-14
            compiler: ldc-latest
            arch: aarch64

    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
      - name: Install 32-bit runtime
        if: runner.os == 'Linux' && matrix.arch == 'x86'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib
      - name: Run D benchmark
        shell: bash
        run: dub run -c benchmark --compiler="$DC" --arch="${{ matrix.arch }}" 2>&1 | tee d-benchmark.log
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d-benchmark-${{ matrix.name }}
          path: d-benchmark.log
          if-no-files-found: warn
