name: C++ CI

on:
  workflow_dispatch:
  push:
    branches: [master, dev]
    paths-ignore:
      - "docs/**"
      - "source/**"
      - "**.d"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "SECURITY.md"
      - "zensical.toml"
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.platform }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, linux-x86, linux-arm64, windows-x86_64, macos-arm64]
        compiler: [gcc, clang, msvc]
        exclude:
          - platform: linux-arm64
            compiler: msvc
          - platform: linux-x86_64
            compiler: msvc
          - platform: linux-x86
            compiler: clang
          - platform: linux-x86
            compiler: msvc
          - platform: windows-x86_64
            compiler: gcc
          - platform: macos-arm64
            compiler: gcc
          - platform: macos-arm64
            compiler: msvc
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            generator: Ninja
            packages: gcc-16 g++-16
          - platform: linux-x86
            runner: ubuntu-latest
            generator: Ninja
            cxxflags: "-m32"
            packages: gcc-16-multilib g++-16-multilib libc6-dev-i386
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            generator: Ninja
            packages: gcc-16 g++-16
          - platform: windows-x86_64
            runner: windows-2022
            generator: Visual Studio 17 2022
          - platform: macos-arm64
            runner: macos-14
            generator: Ninja

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools with mise
        uses: jdx/mise-action@v2

      - name: Setup C++ compiler
        uses: aminya/setup-cpp@v1.8.0
        with:
          compiler: ${{ matrix.compiler == 'msvc' && 'msvc-14.42' || matrix.compiler == 'clang' && 'llvm-22' || 'gcc-16' }}
          vcvarsall: true

      - name: Install dependencies
        if: runner.os == 'Linux' && matrix.compiler == 'gcc'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Install 32-bit runtime
        if: matrix.platform == 'linux-x86'
        run: sudo apt-get update &&         sudo apt-get install -y lib32gcc-16-dev lib32stdc++6

      - name: Configure
        shell: bash
        run: |
          rm -rf build
          if [[ "${{ matrix.compiler }}" == "msvc" ]]; then
            cmake -S . -B build -G "Visual Studio 17 2022" -T "v143,version=14.42" \
              -DOE_ENABLE_TESTING=ON \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          elif [[ "${{ matrix.platform }}" == "windows-x86_64" && "${{ matrix.compiler }}" == "clang" ]]; then
            cmake -S . -B build -G Ninja \
              -DOE_ENABLE_TESTING=ON \
              -DOE_ENABLE_WERROR=OFF \
              -DHAVE_STD_REGEX=ON \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
          else
            if [[ "${{ matrix.compiler }}" == "clang" ]]; then
              cc=clang
              cxx=clang++
            else
              cc=gcc-16
              cxx=g++-16
            fi
            CC="$cc" CXX="$cxx" cmake -S . -B build \
              -G "${{ matrix.generator }}" \
              -DOE_ENABLE_TESTING=ON \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" \
              -DCMAKE_CXX_FLAGS="${{ matrix.cxxflags }}"
          fi

      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
            cmake --build build --parallel 1
          else
            cmake --build build --parallel
          fi

      - name: Test with CTest
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure --output-junit test-results.xml 2>&1 | tee ctest.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.platform }}-${{ matrix.compiler }}
          path: |
            test-results.xml
            ctest.log
          if-no-files-found: warn

  coverage:
    name: Linux coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools with mise
        uses: jdx/mise-action@v2
      - name: Setup coverage compiler
        uses: aminya/setup-cpp@v1.8.0
        with:
          compiler: gcc-16
          gcovr: true
      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja \
            -DOE_ENABLE_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc-16 -DCMAKE_CXX_COMPILER=g++-16 \
            -DCMAKE_CXX_FLAGS="--coverage"
          cmake --build build --parallel
      - name: Run tests and collect coverage
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee ctest-coverage.log
          gcovr --root . --object-directory build \
            --xml-pretty --output coverage.xml \
            --html-details coverage.html \
            --print-summary \
            --fail-under-line 50
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-linux-x86_64
          path: |
            coverage.xml
            coverage.html
            coverage*.html
            ctest-coverage.log
          if-no-files-found: warn

  fuzz:
    name: Linux libFuzzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools with mise
        uses: jdx/mise-action@v2
      - name: Setup fuzzing compiler
        uses: aminya/setup-cpp@v1.8.0
        with:
          compiler: llvm-18
      - name: Configure and build fuzzer
        run: |
          rm -rf build
          CC=clang CXX=clang++ cmake -S . -B build -G Ninja \
            -DOE_ENABLE_FUZZING=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build --target types_fuzz --parallel
      - name: Fuzz
        run: |
          mkdir -p fuzz-corpus
          mkdir -p fuzz-artifact
          ./build/types_fuzz fuzz-corpus \
            -artifact_prefix=fuzz-artifact/ \
            -max_total_time=60 2>&1 | tee fuzz.log
      - name: Upload fuzz results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-linux-x86_64
          path: |
            fuzz.log
            fuzz-artifact
            fuzz-corpus
          if-no-files-found: warn

  big-endian:
    name: Linux s390x big-endian
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test under QEMU
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: s390x
          distro: ubuntu_latest
          githubToken: ${{ github.token }}
          install: |
            apt-get update -q -y
            apt-get install -q -y clang cmake ninja-build git
          dockerRunArgs: |
            --volume "${PWD}:/workspace"
          shell: /bin/bash
          run: |
            set -o pipefail
            cd /workspace
            cmake -S . -B build -G Ninja \
              -DOE_ENABLE_TESTING=ON -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
            cmake --build build --parallel
            ctest --test-dir build --output-on-failure 2>&1 | tee ctest-s390x.log
      - name: Upload big-endian results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-linux-s390x-big-endian
          path: ctest-s390x.log
          if-no-files-found: warn
