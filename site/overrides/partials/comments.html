{% if page.meta.comments %}
<h2 id="__comments">{{ lang.t("meta.comments") }}</h2>

<script src="https://giscus.app/client.js"
        data-repo="ACoderOrHacker/OE"
        data-repo-id="R_kgDOTErAHA"
        data-category="Announcements"
        data-category-id="DIC_kwDOTErAHM4DAHU_"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="top"
        data-theme="preferred_color_scheme"
        data-lang="en"
        crossorigin="anonymous"
        async>
</script>

<!-- Synchronize Giscus theme with palette -->
<script>
    /// Get the captppuccin theme by the configs
    function getGiscusTheme(palette_) {

        // In Material Theme for Zensical, just uncomment the following line and replace the catppuccin theme processor:
        // return palette.color.scheme === "slate" ? "transparent_dark" : "light";

        // In catppuccin-zensical, its scheme name is `catppuccin-xxx`
        // But in catppuccin-giscus, it uses `catppuccin_xxx`
        // So just replace `-` as `_`
        return palette_.color.scheme.replace("-", "_");
    }

    const giscus = document.querySelector("script[src*=giscus]");

    // Set palette on initial load
    const palette_ = __md_get("__palette");
    if (palette_ && typeof palette_.color === "object") {
        const theme = getGiscusTheme(palette_);

        // Instruct Giscus to set theme
        giscus.setAttribute("data-theme", theme);
    }

    // Register event handlers after documented loaded
    document.addEventListener("DOMContentLoaded", function () {
        const ref = document.querySelector("[data-md-component=palette]");
        ref.addEventListener("change", function () {
            const palette_ = __md_get("__palette");
            if (palette_ && typeof palette_.color === "object") {
                const theme = getGiscusTheme(palette_);

                // Instruct Giscus to change theme
                const frame = document.querySelector(".giscus-frame");
                frame.contentWindow.postMessage({giscus: {setConfig: {theme}}}, "https://giscus.app");
            }
        });
    });
</script>
{% endif %}
